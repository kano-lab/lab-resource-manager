# cargo audit の設定
#
# 例外は、このクレートが該当するコードを使っていないことを確かめたものに限る。
# 理由と、例外を外す条件を必ず書く。

[advisories]
ignore = [
  # rmcp 2.x: OAuthクライアントのSSRF対策がホスト名だけを見ている。
  # このクレートはrmcpのサーバー側の機能だけを有効にしており、OAuthクライアントは
  # ビルドに含まれない。rmcp 3.7以降へ上げたら外す。
  "RUSTSEC-2026-0457",
  # rmcp 2.x: Streamable HTTPクライアントが応答本文を上限なくバッファする。
  # 同じくクライアント側の問題で、このクレートは使っていない。rmcp 3.9以降へ上げたら外す。
  "RUSTSEC-2026-0462",
]
