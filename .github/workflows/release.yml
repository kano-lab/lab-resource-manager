name: Release

# release-plz keeps a release pull request open with the next versions and
# changelogs (see release-plz.toml). Merging it publishes the crates, tags them
# and creates the GitHub releases. When the application is among them, its
# binaries are built and attached to its release, where deploy/auto-update.sh
# looks for them.

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # crates.ioのTrusted Publishing（OIDC）が、このワークフローの素性を証明するために要る
      id-token: write
    outputs:
      app_tag: ${{ steps.app.outputs.tag }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Release the packages of a merged release pull request
        id: release
        uses: release-plz/action@v0.5.146
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the application's release
        id: app
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          tag="$(jq -r '.[] | select(.package_name == "lab-resource-manager") | .tag' <<< "${RELEASES:-[]}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-pr:
    name: Release Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Open or update the release pull request
        uses: release-plz/action@v0.5.146
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    needs: release
    if: ${{ needs.release.outputs.app_tag != '' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.app_tag }}

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}

      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --bin lab-resource-manager --bin gpu-usage-reporter

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lab-resource-manager dist/
          cp target/${{ matrix.target }}/release/gpu-usage-reporter dist/
          cp -r deploy/ dist/
          cd dist && tar -czvf ../lab-resource-manager-${{ matrix.target }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lab-resource-manager-${{ matrix.target }}
          path: lab-resource-manager-${{ matrix.target }}.tar.gz

  upload:
    name: Upload Release Artifacts
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.app_tag }}
          files: artifacts/*.tar.gz
