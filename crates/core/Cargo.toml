[package]
name = "lab-resource-manager-core"
version = "0.1.0"
edition = "2024"
authors = ["Kinji Kawaguchi"]
license = "MIT OR Apache-2.0"
description = "Domain model and use cases of lab-resource-manager: GPU and room reservations, independent of any calendar or chat service"
repository = "https://github.com/kano-lab/lab-resource-manager"
keywords = ["resource-management", "reservation", "gpu", "ddd"]
categories = ["data-structures", "date-and-time"]
readme = "README.md"
rust-version = "1.90"

[dependencies]
async-trait.workspace = true
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
# Expands the recurrence rules (RFC 5545 RRULE) of recurring reservations.
rrule = "0.14"
serde.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
