display_information:
  name: "LabResourceManager"
  description: "研究室リソースの管理・通知ボット"
  background_color: "#1d7c00"
features:
  bot_user:
    display_name: "Lab Resource Manager"
    always_online: true
  slash_commands:
    - command: "/free"
      description: "いま空いているリソースを一覧する"
      should_escape: false
    - command: "/reserve"
      description: "リソースを予約する"
      should_escape: false
    - command: "/register-calendar"
      description: "自分のメールアドレスをリソースカレンダーに登録する"
      usage_hint: "<your-email@example.com>"
      should_escape: false
    - command: "/link-user"
      description: "他の人物の識別情報を紐付ける（管理者用）"
      should_escape: false
    - command: "/mcp-token"
      description: "MCPアクセストークンを発行する"
      should_escape: false
    - command: "/status"
      description: "実利用の監視の稼働状況を表示する（管理者用）"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - "chat:write"
      - "commands"
      - "im:write"
  pkce_enabled: false
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
