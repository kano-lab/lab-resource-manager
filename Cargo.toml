[workspace]
members = ["crates/*"]
resolver = "3"

# Metadata shared by the application and the core library.
[workspace.package]
edition = "2024"
authors = ["Kinji Kawaguchi"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kano-lab/lab-resource-manager"
rust-version = "1.90"

# Versions shared by the application and the core library, kept in one place.
[workspace.dependencies]
async-trait = "0.1.89"
chrono = "0.4.42"
chrono-tz = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
# Each crate states the features it needs; the core library needs far fewer than the app.
tokio = "1.48.0"
tracing = "0.1"
uuid = { version = "1.11", features = ["v4"] }
